name: Kirim Digest
on:
  schedule:
    - cron: '15 15 * * *'  # 22:00 WIB = 15:00 UTC
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BASE_URL }}/api/cron/digest" --max-time 55
