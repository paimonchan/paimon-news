name: Ingest Berita
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - run: |
          curl -s -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BASE_URL }}/api/cron/ingest?batchSize=7&batch=${{ matrix.batch }}" \
            --max-time 55
