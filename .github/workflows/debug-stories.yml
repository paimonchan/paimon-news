name: Debug Stories
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/debug-stories.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
